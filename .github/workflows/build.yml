name: Derle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        shell: powershell
        run: ./build.ps1

      - name: Exe'yi yukle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PCHizlandirici
          path: dist/PCHizlandirici.exe

      - name: Surume ekle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          hash=$(sha256sum dist/PCHizlandirici.exe | cut -d' ' -f1)
          notes=$(printf 'Format sonrasi tek tikla tam oyun performansi.\n\n1. PCHizlandirici.exe dosyasini indirin\n2. Cift tiklayin, yonetici izni verin\n3. OPTIMIZE ET butonuna basin ve yeniden baslatin\n\nSmartScreen uyarisi cikarsa: Ek bilgi > Yine de calistir\n\nSHA256: %s' "$hash")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/PCHizlandirici.exe --clobber
          else
            gh release create "$TAG" dist/PCHizlandirici.exe --title "PC Hizlandirici $TAG" --notes "$notes"
          fi
